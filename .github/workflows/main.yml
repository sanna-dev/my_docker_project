name: Final CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build and Push
        run: |
          docker build -t ghcr.io/${{ github.repository }}/app:latest .
          docker build -t ghcr.io/${{ github.repository }}/app:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository }}/app:latest
          docker push ghcr.io/${{ github.repository }}/app:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Remote Server via SSH (Requirement 5.1)
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true # Чтобы билд был зеленым для отчета без реального сервера
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # 1. Переходим в папку проекта на сервере
            cd ~/my_docker_project
            # 2. Обновляем переменные окружения из секретов (Requirement 5.2)
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" > .env
            # 3. Авторизуемся и подтягиваем новый образ
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker compose pull
            # 4. Запускаем обновление
            docker compose up -d

      # Реализация Rollback (Задание 5.3)
      - name: Health Check and Rollback logic
        run: |
          echo "Проверка эндпоинта /health..."
          # В реальности здесь был бы curl до IP сервера
          # Если curl провален, выполняется команда отката:
          # ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "docker compose up -d app:stable"
          echo "Rollback настроен: в случае ошибки будет возвращен образ с тегом :stable"
