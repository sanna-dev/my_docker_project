name: Project CI/CD

on:
  push:
    branches: [ "task-3", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Hadolint Check (Creative Task 3)
        uses: hadolint/hadolint-action@v3.1.0
        continue-on-error: true # Не останавливать билд, если линтеру что-то не нравится
        with:
          dockerfile: Dockerfile

      - name: Build image for scanning
        run: docker build -t my-app:${{ github.sha }} .

      - name: Trivy Security Scan (Requirement Task 3)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-app:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  integration-tests:
    needs: lint-and-security
    # Добавляем условие, чтобы тесты запускались, даже если линтер нашел недочеты
    if: always() && needs.lint-and-security.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Start Services (Requirement Task 1 & 3)
        run: docker compose up -d

      - name: Wait for services
        run: sleep 25

      - name: Show Application Logs (Proof for Task 2)
        run: docker compose logs app

      - name: Test Health Check
        run: curl --fail http://localhost:8000/health

      - name: Run Failure Simulation (Creative Task 2)
        run: bash scripts/simulate_failure.sh

  notifications:
    needs: [lint-and-security, integration-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: CI/CD Status Log (Creative Task 3 Notification)
        run: |
          echo "🚀 Отчет CI/CD"
          echo "Статус тестов: ${{ needs.integration-tests.result }}"
          echo "Хэш коммита: ${{ github.sha }}"
