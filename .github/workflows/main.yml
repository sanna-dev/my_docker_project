name: Project CI/CD

on:
  push:
    branches: [ "task-3", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Hadolint Check
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Build image for scanning
        run: docker build -t my-app:${{ github.sha }} .

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-app:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

  integration-tests:
    needs: lint-and-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Start Services
        run: docker compose up -d

      - name: Wait for services
        run: sleep 25

      - name: Show Logs
        run: docker compose logs app

      - name: Test Health
        run: curl --fail http://localhost:8000/health

      - name: Run Failure Simulation
        run: bash scripts/simulate_failure.sh

  notifications:
    needs: [lint-and-security, integration-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Notification (Log only)
        run: |
          echo "🚀 CI/CD Report"
          echo "Статус: ${{ needs.integration-tests.result }}"
          echo "Коммит: ${{ github.sha }}"
