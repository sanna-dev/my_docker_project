name: Project CI/CD

on:
  push:
    branches: [ "main", "feature-*" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. Умное тегирование (Requirement 4.1 с {version})
      - name: Set Docker Tags
        id: vars
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          VERSION=$(cat VERSION)
          
          if [ "$BRANCH_NAME" = "main" ]; then
            # Для main ставим два тега (через запятую для удобства сборки)
            echo "tags=my-app:stable,my-app:$VERSION" >> $GITHUB_OUTPUT
            echo "primary_tag=stable" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH_NAME" == feature-* ]]; then
            # Для feature ставим dev- тег
            echo "tags=my-app:dev-$BRANCH_NAME" >> $GITHUB_OUTPUT
            echo "primary_tag=dev-$BRANCH_NAME" >> $GITHUB_OUTPUT
          else
            echo "tags=my-app:latest" >> $GITHUB_OUTPUT
            echo "primary_tag=latest" >> $GITHUB_OUTPUT
          fi

      # 2. Сборка образа (Requirement 4.2)
      # Собираем с использованием первого (основного) тега для проверки размера
      - name: Build Docker Image
        run: docker build -t "my-app:${{ steps.vars.outputs.primary_tag }}" .

      # 3. Проверка размера (Requirement 4.2 - лимит 300MB)
      - name: Check Image Size
        run: |
          SIZE_BYTES=$(docker image inspect "my-app:${{ steps.vars.outputs.primary_tag }}" --format='{{.Size}}')
          LIMIT=314572800 
          echo "Размер образа: $SIZE_BYTES байт"
          if [ "$SIZE_BYTES" -gt "$LIMIT" ]; then
            echo "ОШИБКА: Образ > 300MB"
            exit 1
          fi

      # 4. Финальный отчет
      - name: Final Summary
        run: |
          echo "--- ОТЧЕТ ПО ЗАДАНИЮ 4 ---"
          echo "Ветка: ${{ github.ref_name }}"
          echo "Сгенерированные теги: ${{ steps.vars.outputs.tags }}"
