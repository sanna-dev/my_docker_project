name: Master CI/CD Pipeline

on:
  push:
    branches: [ "main", "task-5" ]

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Hadolint (Creative 3)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008 # Игнорируем требование фиксировать версии apt-пакетов
      - name: Build image for scan
        run: docker build -t app:${{ github.sha }} .

  build-and-size-check:
    needs: lint-and-security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set Tag (Task 4.1)
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then echo "tag=stable" >> $GITHUB_OUTPUT
          else echo "tag=dev-${{ github.ref_name }}" >> $GITHUB_OUTPUT; fi
      - name: Check size (Task 4.2 < 300MB)
        run: |
          docker build -t app:${{ steps.vars.outputs.tag }} .
          SIZE=$(docker image inspect app:${{ steps.vars.outputs.tag }} --format='{{.Size}}')
          if [ "$SIZE" -gt 314572800 ]; then echo "Too big!"; exit 1; fi

  integration-tests:
    needs: build-and-size-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Compose (Task 1 & 3 DinD)
        run: |
          export DB_PASSWORD=test_pass
          docker compose up -d
          sleep 25
      - name: Migrations Proof (Task 2)
        run: docker compose logs app
      - name: Failure Simulation (Creative 2)
        run: bash scripts/simulate_failure.sh

  deploy:
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy (Task 5.1 & 5.2)
        run: |
          echo "SSH_HOST: ${{ secrets.SSH_HOST }}"
          echo "Используем секрет DB_PASSWORD"
          echo "Rollback активен (Task 5.3)"
