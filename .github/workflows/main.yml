name: Project CI/CD

on:
  push:
    branches: [ "main", "feature-*" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Умное тегирование: stable для main, dev- для feature-*
      - name: Set Docker Tag
        id: vars
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "tag=stable" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == feature-* ]]; then
            echo "tag=dev-${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
          fi

      # Проверка размера образа (< 300MB)
      - name: Build and Check Size
        run: |
          docker build -t my-app:${{ steps.vars.outputs.tag }} .
          SIZE=$(docker image inspect my-app:${{ steps.vars.outputs.tag }} --format='{{.Size}}')
          LIMIT=314572800
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "ОШИБКА: Образ > 300MB"
            exit 1
          fi
          echo "Размер в норме: $SIZE байт"

      - name: Summary
        run: echo "Тег образа: my-app:${{ steps.vars.outputs.tag }}"
