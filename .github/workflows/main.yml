name: Project CI/CD

on:
  push:
    branches: [ "main", "feature-*" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # 1. Умное тегирование (Requirement 4.1)
      - name: Set Docker Tag
        id: vars
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          echo "Processing branch: $BRANCH_NAME"
          if [ "$BRANCH_NAME" = "main" ]; then
            echo "TAG=stable" >> $GITHUB_ENV
          elif [[ "$BRANCH_NAME" == feature-* ]]; then
            echo "TAG=dev-$BRANCH_NAME" >> $GITHUB_ENV
          else
            echo "TAG=latest" >> $GITHUB_ENV
          fi

      # 2. Сборка и проверка размера (Requirement 4.2)
      - name: Build and Check Image Size
        run: |
          echo "Building with tag: my-app:${{ env.TAG }}"
          docker build -t "my-app:${{ env.TAG }}" .
          
          # Получаем размер в мегабайтах для наглядности
          SIZE_BYTES=$(docker image inspect "my-app:${{ env.TAG }}" --format='{{.Size}}')
          SIZE_MB=$(echo "scale=2; $SIZE_BYTES / 1048576" | bc)
          echo "Текущий размер образа: $SIZE_MB MB ($SIZE_BYTES байт)"
          
          LIMIT_MB=300
          if (( $(echo "$SIZE_MB > $LIMIT_MB" | bc -l) )); then
            echo "ОШИБКА: Образ весит $SIZE_MB MB, что больше лимита в $LIMIT_MB MB!"
            exit 1
          fi
          echo "Размер в норме. Лимит не превышен."

      # 3. Финальный отчет
      - name: Final Summary
        run: |
          echo "--- ОТЧЕТ ПО ЗАДАНИЮ 4 ---"
          echo "Ветка: ${{ github.ref_name }}"
          echo "Присвоенный тег: my-app:${{ env.TAG }}"
