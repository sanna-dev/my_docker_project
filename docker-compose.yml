version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASSWORD} # Секрет из GitHub
      POSTGRES_DB: app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d app_db"]
      interval: 5s
      retries: 5
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    networks:
      - app_network

  app:
    image: ghcr.io/${GITHUB_REPOSITORY}/app:latest
    ports:
      - "8000:8000"
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # --- Творческое задание 5: Мониторинг ---
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - app_network

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
